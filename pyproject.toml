[project]
name = "prowlarr-mcp"
version = "0.1.0"
description = "MCP server for Prowlarr: search indexers and queue downloads."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
]

[project.scripts]
prowlarr-mcp = "prowlarr_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prowlarr_mcp"]
